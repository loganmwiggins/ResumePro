
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updated Resume</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            max-width: 900px;
            margin: auto;
            padding: 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 3px solid #00d4ff;
        }

            .header h1 {
                margin: 0;
                font-size: 36px;
                color: #00d4ff;
                text-shadow: 2px 2px 10px rgba(0, 212, 255, 0.8);
            }

            .header p a {
                color: #00d4ff;
                text-decoration: none;
                font-weight: bold;
                transition: color 0.3s;
            }

                .header p a:hover {
                    color: #ff00d4;
                }

        .section {
            margin-bottom: 30px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

            .section:hover {
                transform: scale(1.02);
            }

        h2 {
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 5px;
            color: #00d4ff;
            font-size: 24px;
            text-shadow: 1px 1px 10px rgba(0, 212, 255, 0.8);
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        .experience, .education, .certifications, .projects {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        .skills ul {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .skills li {
            background: linear-gradient(135deg, #00d4ff, #ff00d4);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.3s;
        }

            .skills li:hover {
                transform: scale(1.1);
                box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            }
    </style>
</head>
<body>
    <div class="header">
        <h1></h1>
        <p>Email: <a href="#"></a> | Phone: </p>
        <p><a href="#">Website</a> | <a href="#">LinkedIn</a> | <a href="#">GitHub</a></p>
    </div>

    <div class="section">
        <h2>Education</h2>
        <div class="education"></div>
    </div>

    <div class="section">
        <h2>Certifications</h2>
        <div class="certifications"></div>
    </div>

    <div class="section">
        <h2>Experience</h2>
        <div class="experience"></div>
    </div>

    <div class="section">
        <h2>Projects</h2>
        <div class="projects"></div>
    </div>

    <div class="section skills">
        <h2>Skills</h2>
        <ul></ul>
    </div>
</body>
</html>
